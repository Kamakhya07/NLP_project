{% extends "base.html" %}

{% block title %}Create Account | CyberShield Social{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm overflow-hidden" style="background-color: #ffffff; border: 1px solid var(--beige-border); border-radius: 12px;">
                <div class="card-header p-4 text-center border-bottom" style="background-color: var(--beige-card); border-color: var(--beige-border) !important;">
                    <div class="brand-icon-wrapper mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem; background-color: var(--coffee-warm); color: white;">
                        <i class="fa-solid fa-user-plus text-warning"></i>
                    </div>
                    <h4 class="fw-bold mb-1" style="color: var(--coffee-darkest);">Create an Account</h4>
                    <p class="small mb-0" style="color: var(--beige-muted);">Join the CyberShield AI-moderated community</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="display_name" class="form-label small fw-semibold" style="color: var(--coffee-warm);">Display Name</label>
                            <input type="text" class="form-control" style="border-color: var(--beige-border); color: var(--coffee-darkest);" id="display_name" name="display_name" placeholder="e.g. Alex Morgan" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold" style="color: var(--coffee-warm);">Username</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: #f7f4ee; border-color: var(--beige-border); color: var(--coffee-muted);">@</span>
                                <input type="text" class="form-control" style="border-color: var(--beige-border); color: var(--coffee-darkest);" id="username" name="username" placeholder="alexmorgan" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold" style="color: var(--coffee-warm);">Email Address</label>
                            <input type="email" class="form-control" style="border-color: var(--beige-border); color: var(--coffee-darkest);" id="email" name="email" placeholder="alex@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-semibold" style="color: var(--coffee-warm);">Password</label>
                            <input type="password" class="form-control" style="border-color: var(--beige-border); color: var(--coffee-darkest);" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-saas-primary w-100 py-2 fw-semibold rounded-pill shadow-sm mb-3">
                            <i class="fa-solid fa-shield-check me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center pt-2 border-top" style="border-color: var(--beige-border) !important;">
                        <span class="small" style="color: var(--beige-muted);">Already have an account?</span>
                        <a href="{{ url_for('login') }}" class="small fw-semibold ms-1 text-decoration-none" style="color: var(--olive-dark);">Sign in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Page Not Found | CyberShield{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="error-illustration mb-4">
                <i class="fa-solid fa-shield-virus display-1 text-primary-gradient animate-pulse"></i>
            </div>
            <h1 class="display-3 fw-extrabold text-light mb-2">404</h1>
            <h3 class="fw-bold text-light mb-3">Page Not Found</h3>
            <p class="text-secondary mb-4">
                The resource or route you requested does not exist or has been relocated.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-primary-gradient rounded-pill px-4 py-2 fw-semibold">
                    <i class="fa-solid fa-house me-1"></i> Return Home
                </a>
                <a href="{{ url_for('history') }}" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold">
                    <i class="fa-solid fa-clock-rotate-left me-1"></i> View History
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
